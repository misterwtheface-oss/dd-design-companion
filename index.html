<!DOCTYPE html>
<!--
  DD Design Companion — a design-companion + wiki for the Darkest Dungeon 1 overhaul mod.
  NOT a build calculator: a reference & visualization tool. data.js is GENERATED by
  build-data.mjs (window.DDC_DATA); do not edit it by hand.

  Architecture (adapted from the build-calc skeleton, see SPEC_PLAN.md):
    - CATALOG-BROWSER-FIRST: the home screen is a top-nav of surfaces; each surface is a
      searchable, category-tabbed tile grid.
    - Clicking a tile opens a DETAIL OVERLAY on #detail-overlay-root.
    - Overlays are statically sized (CSS); every re-render preserves scrollTop.
    - Category/domain tags are DATA-coloured banners (--aff-color/--aff-text), reused from
      the skeleton's trait-banner model.
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DD Design Companion</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- The catalog view (home) is rendered here by app.js. -->
  <div id="app"></div>

  <!-- Overlay layers, toggled via .hidden.
       #overlay-root       = future selectors/pickers (z 100)
       #detail-overlay-root = detail pages, stacks ABOVE (z 200) -->
  <div id="overlay-root" class="hidden" aria-hidden="true"></div>
  <div id="detail-overlay-root" class="hidden" aria-hidden="true"></div>
  <!-- #picker-root = the Design Studio's searchable add-pickers (own listeners, z 300) -->
  <div id="picker-root" class="hidden" aria-hidden="true"></div>

  <!-- data.js defines window.DDC_DATA; designer.js defines window.DDCDesigner; app.js drives both -->
  <script src="data.js"></script>
  <script src="designer.js" defer></script>
  <script src="app.js" defer></script>

  <!-- Cloudflare Web Analytics — shared misterwtheface-oss.github.io token (public-by-design);
       filter by page path in the CF dashboard. Activated at public release. -->
  <script type='module' src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "b5abb0125b524ee8a96efbe9899114a4"}'></script>
</body>
</html>
